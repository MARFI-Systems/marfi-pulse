name: Build MARFI Pulse app image

# Custom OneUptime app image with Hexclave wrap. Probe/nginx stay stock 13.0.5.
on:
  push:
    branches: [marfi/hexclave-pilot]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: marfi-app-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/marfi-systems/marfi-pulse-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render production App Dockerfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("packages/App/Dockerfile.tpl").read_text()
          out = re.sub(
              r"\{\{ if eq \.Env\.ENVIRONMENT \"development\" \}\}.*?\{\{ else \}\}",
              "",
              src,
              flags=re.S,
          )
          out = out.replace("{{ end }}\n", "")
          out = out.replace(
              "RUN npm install -g npm@latest",
              "RUN npm install -g npm@latest && npm config set ignore-scripts false",
          )
          Path("packages/App/Dockerfile").write_text(out)
          PY

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=hexclave-pilot
            type=sha,prefix=marfi-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: packages/App/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=hexclave-pilot
            IS_ENTERPRISE_EDITION=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
